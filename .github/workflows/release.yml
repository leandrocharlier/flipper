name: Desktop release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version (must match desktop/electron/package.json)
        required: true
        default: '1.0.0'
      publish_android:
        description: Also start Maven publishing after the GitHub release
        type: boolean
        default: true
      publish_release:
        description: Publish downloads after all native builds and tests pass
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win
            arch: x64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
          - os: ubuntu-24.04
            target: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_VERSION: ${{ inputs.version }}
      TZ: Pacific/Pohnpei
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Check release version
        run: node -e 'const v=process.env.RELEASE_VERSION; if(!/^\d+\.\d+\.\d+$/.test(v) || require("./electron/package.json").version!==v) process.exit(1)'
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-0 libfuse2t64 xvfb
      - name: Install dependencies
        run: |
          npm install --global yarn@1.22.22 --force
          for attempt in 1 2 3; do
            yarn install --frozen-lockfile --non-interactive && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
          npm --prefix electron ci
      - name: Build themes and desktop backend
        run: |
          yarn build:themes
          yarn build:flipper-server --desktop
      - name: Test complete desktop suite and process lifecycle
        run: |
          node node_modules/typescript/bin/tsc --noEmit
          node node_modules/cross-env/src/bin/cross-env.js TZ=Pacific/Pohnpei node node_modules/jest/bin/jest.js --runInBand
          npm --prefix electron test
          npm --prefix electron run test:server
      - name: Package desktop
        run: npm --prefix electron run dist:${{ matrix.target }} -- --${{ matrix.arch }}
      - name: Configure Linux Electron sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root ../dist/electron/linux-unpacked/chrome-sandbox
          sudo chmod 4755 ../dist/electron/linux-unpacked/chrome-sandbox
      - name: Test packaged application
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum node electron/test/packaged.cjs
          else
            node electron/test/packaged.cjs
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/electron/Flipper-*.exe
            dist/electron/Flipper-*.zip
            dist/electron/Flipper-*.dmg
            dist/electron/Flipper-*.AppImage
            dist/electron/Flipper-*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: diagnostics-${{ matrix.target }}-${{ matrix.arch }}
          retention-days: 7
          path: work/packaged-smoke
  publish:
    needs: build
    if: inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Publish tested desktop artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum Flipper-* > SHA256SUMS.txt
          gh release create "v$RELEASE_VERSION" --target "$RELEASE_COMMIT" --draft --title "Flipper Community v$RELEASE_VERSION" --notes-file "../desktop/releases/$RELEASE_VERSION.md" Flipper-* SHA256SUMS.txt
          gh release edit "v$RELEASE_VERSION" --draft=false --latest
      - name: Publish Android dependencies (normal release default)
        if: inputs.publish_android
        run: gh workflow run publish-android.yml --ref "v$RELEASE_VERSION" --field "tag=v$RELEASE_VERSION"
