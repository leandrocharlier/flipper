name: Desktop CI
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/nodejs.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/nodejs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Pacific/Pohnpei
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libsecret-1-0
          npm install --global yarn@1.22.22 --force
          for attempt in 1 2 3; do
            yarn install --frozen-lockfile --non-interactive && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Check TypeScript
        run: |
          node node_modules/typescript/bin/tsc --noEmit
          node node_modules/typescript/bin/tsc -p plugins/tsconfig.json --noEmit
      - name: Test desktop and process lifecycle
        run: |
          node node_modules/jest/bin/jest.js --runInBand
          npm --prefix electron test
