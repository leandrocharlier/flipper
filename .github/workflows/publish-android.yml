name: Publish Android
# Publishes all Android plugins after the same validation used by Android CI.
# Credentials are supplied as environment variables only; never written into source.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag; dispatch this workflow on that same ref'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: maven-central-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: ./.github/workflows/android.yml
    with:
      publish: true
      tag: ${{ inputs.tag }}
    secrets:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
      MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
