// Repackage only known rebuilt artifacts and pinned upstream source trees.
// Never include arbitrary work/, local profiles or publishing credentials.
apply plugin: 'com.vanniktech.maven.publish.base'
apply plugin: 'base'

def nativeName = project.name.substring('native-'.length())
def definitions = [
    openssl: [coordinate: 'local.flipper:openssl:3.5.8-16k', source: 'openssl-3.5.8-16k/x86_64/openssl-3.5.8', license: 'LICENSE.txt', upstream: 'https://github.com/openssl/openssl/tree/openssl-3.5.8', licenseName: 'Apache-2.0', sourceDirs: ['include', 'crypto', 'ssl', 'providers']],
    yoga: [coordinate: 'com.facebook.yoga:yoga:2.0.1-16k', source: 'yoga-2.0.1', license: 'LICENSE', upstream: 'https://github.com/facebook/yoga/tree/v2.0.1', licenseName: 'MIT', sourceDirs: ['java', 'yoga']],
    flexlayout: [coordinate: 'com.facebook.litho:litho-flexlayout:0.50.1-16k', source: 'litho-0.50.1', license: 'LICENSE', upstream: 'https://github.com/facebook/litho/tree/v0.50.1', licenseName: 'Apache-2.0', sourceDirs: ['litho-flexlayout/src']],
    'imagepipeline-native': [coordinate: 'com.facebook.fresco:imagepipeline-native:3.1.3-16k', source: 'fresco-3.1.3', license: 'LICENSE', upstream: 'https://github.com/facebook/fresco/tree/v3.1.3', licenseName: 'MIT', sourceDirs: ['imagepipeline-native/src']],
    nativeimagefilters: [coordinate: 'com.facebook.fresco:nativeimagefilters:3.1.3-16k', source: 'fresco-3.1.3', license: 'LICENSE', upstream: 'https://github.com/facebook/fresco/tree/v3.1.3', licenseName: 'MIT', sourceDirs: ['native-filters/src']],
    nativeimagetranscoder: [coordinate: 'com.facebook.fresco:nativeimagetranscoder:3.1.3-16k', source: 'fresco-3.1.3', license: 'LICENSE', upstream: 'https://github.com/facebook/fresco/tree/v3.1.3', licenseName: 'MIT', sourceDirs: ['native-imagetranscoder/src']],
]
def definition = definitions[nativeName]
def (upstreamGroup, upstreamArtifact, upstreamVersion) = definition.coordinate.split(':')
def inputBase = rootProject.file("android/third-party/generated-16k/maven/${upstreamGroup.replace('.', '/')}/${upstreamArtifact}/${upstreamVersion}/${upstreamArtifact}-${upstreamVersion}")
def sourceRoot = rootProject.file("work/${definition.source}")
def artifactName = "flipper-${nativeName}"
def replacements = [
    'com.facebook.yoga:yoga': 'flipper-yoga',
    'com.facebook.litho:litho-flexlayout': 'flipper-flexlayout',
    'com.facebook.fresco:imagepipeline-native': 'flipper-imagepipeline-native',
    'com.facebook.fresco:nativeimagefilters': 'flipper-nativeimagefilters',
    'com.facebook.fresco:nativeimagetranscoder': 'flipper-nativeimagetranscoder',
]

configurations.maybeCreate('default')
configurations.create('nativeDependencies') {
    canBeConsumed = false
    canBeResolved = false
}
configurations.default.extendsFrom(configurations.nativeDependencies)
// Match the original Java dependencies while replacing rebuilt native modules.
def upstreamPomFile = new File("${inputBase}.pom")
if (upstreamPomFile.isFile()) {
    new XmlSlurper().parse(upstreamPomFile).dependencies.dependency.each { dependency ->
        def coordinate = "${dependency.groupId.text()}:${dependency.artifactId.text()}"
        def replacement = replacements[coordinate]
        def target = replacement ? dependencies.project(path: ':native-' + replacement.substring('flipper-'.length())) : "${coordinate}:${dependency.version.text()}"
        dependencies.add('nativeDependencies', target)
    }
}
if (nativeName != 'openssl') {
    dependencies.add('nativeDependencies', "com.facebook.fbjni:fbjni:${rootProject.FBJNI_VERSION}")
}
def notice = tasks.register('nativeNotice') {
    def destination = layout.buildDirectory.file('notice/NOTICE-Community.txt')
    outputs.file destination
    doLast {
        destination.get().asFile.parentFile.mkdirs()
        destination.get().asFile.text = "Community rebuild of ${definition.coordinate} for Android 16 KB page sizes.\nUpstream: ${definition.upstream}\nMaintained by Leandro Charlier, https://github.com/leandrocharlier/flipper\nOriginal Java/JNI APIs retained. Rebuilt native code; bundled shared C++ runtime removed where fbjni supplies it.\nSee the included upstream license and source archive.\n"
    }
}
def classes = tasks.register('nativeClasses', Jar) {
    dependsOn notice
    archiveClassifier = 'classes'
    from({
        def originalClasses = zipTree("${inputBase}.aar").matching { include 'classes.jar' }.files
        originalClasses ? zipTree(originalClasses.first()) : []
    })
    from(new File(sourceRoot, definition.license)) { into "META-INF/${artifactName}/upstream" }
    from(layout.buildDirectory.dir('notice')) { into "META-INF/${artifactName}" }
    if (nativeName == 'nativeimagetranscoder') {
        from(rootProject.file('work/libjpeg-turbo-1.5.3')) {
            include 'LICENSE*', 'README.ijg'
            into "META-INF/${artifactName}/libjpeg-turbo"
        }
    }
}
def nativeAar = tasks.register('nativeAar', Zip) {
    dependsOn notice, classes
    archiveBaseName = artifactName
    archiveVersion = project.version
    archiveExtension = 'aar'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from({ zipTree("${inputBase}.aar") }) { exclude 'classes.jar' }
    from(classes) { rename { 'classes.jar' } }
    from(sourceRoot.toPath().resolve(definition.license).toFile()) { into 'META-INF/licenses/upstream' }
    from(layout.buildDirectory.dir('notice')) { into 'META-INF' }
    if (nativeName == 'nativeimagetranscoder') {
        from(rootProject.file('work/libjpeg-turbo-1.5.3')) {
            include 'LICENSE*', 'README.ijg'
            into 'META-INF/licenses/libjpeg-turbo'
        }
    }
}
artifacts.add('default', nativeAar)

def sources = tasks.register('nativeSources', Jar) {
    dependsOn notice
    archiveBaseName = artifactName
    archiveClassifier = 'sources'
    definition.sourceDirs.each { directory ->
        from(new File(sourceRoot, directory)) {
            include '**/*.java', '**/*.kt', '**/*.c', '**/*.cc', '**/*.cpp', '**/*.h', '**/*.hpp', '**/*.cmake', '**/CMakeLists.txt', '**/*.in', '**/LICENSE*', '**/NOTICE*'
            exclude '**/build/**', '**/.gradle/**', '**/.git/**'
            into directory
        }
    }
    from(new File(sourceRoot, definition.license))
    from(rootProject.file('scripts/native-16k/CMakeLists.txt')) { into 'community-build' }
    if (nativeName == 'openssl') {
        from(rootProject.file('scripts/build-openssl-16k.sh')) { into 'community-build' }
    }
    if (nativeName == 'nativeimagetranscoder') {
        from(rootProject.file('work/libjpeg-turbo-1.5.3')) {
            include '*.c', '*.h', 'LICENSE*', 'README.ijg'
            into 'libjpeg-turbo'
        }
    }
    from(layout.buildDirectory.dir('notice'))
}
def documentation = tasks.register('nativeDocumentation', Jar) {
    dependsOn notice
    archiveBaseName = artifactName
    archiveClassifier = 'javadoc'
    from(layout.buildDirectory.dir('notice'))
    from(new File(sourceRoot, definition.license))
}
mavenPublishing.coordinates(rootProject.GROUP, artifactName, rootProject.VERSION_NAME)
publishing.publications.create('maven', MavenPublication) {
    artifact(nativeAar)
    artifact(sources)
    artifact(documentation)
    pom {
        name = "Flipper Community ${nativeName} (16 KB)"
        description = "Independent Android 16 KB rebuild of ${definition.coordinate}; original APIs and attribution retained."
        url = 'https://github.com/leandrocharlier/flipper'
        licenses { license { name = definition.licenseName; url = "${definition.upstream.replace('/tree/', '/blob/')}/${definition.license}"; distribution = 'repo' } }
        developers { developer { id = 'leandrocharlier'; name = 'Leandro Charlier'; url = 'https://github.com/leandrocharlier' } }
        scm { url = 'https://github.com/leandrocharlier/flipper'; connection = 'scm:git:https://github.com/leandrocharlier/flipper.git' }
        withXml {
            def dependenciesNode = asNode().appendNode('dependencies')
            def original = new XmlSlurper().parse(new File("${inputBase}.pom"))
            original.dependencies.dependency.each { dependency ->
                def coordinate = "${dependency.groupId.text()}:${dependency.artifactId.text()}"
                def replacement = replacements[coordinate]
                def node = dependenciesNode.appendNode('dependency')
                node.appendNode('groupId', replacement ? rootProject.GROUP : dependency.groupId.text())
                node.appendNode('artifactId', replacement ?: dependency.artifactId.text())
                node.appendNode('version', replacement ? rootProject.VERSION_NAME : dependency.version.text())
                node.appendNode('scope', dependency.scope.text() ?: 'runtime')
                def exclusions = node.appendNode('exclusions')
                replacements.keySet().each { excluded ->
                    def (g, a) = excluded.split(':')
                    def exclusion = exclusions.appendNode('exclusion')
                    exclusion.appendNode('groupId', g); exclusion.appendNode('artifactId', a)
                }
            }
            if (nativeName != 'openssl') {
                def runtime = dependenciesNode.appendNode('dependency')
                runtime.appendNode('groupId', 'com.facebook.fbjni'); runtime.appendNode('artifactId', 'fbjni')
                runtime.appendNode('version', rootProject.FBJNI_VERSION); runtime.appendNode('scope', 'runtime')
            }
        }
    }
}
