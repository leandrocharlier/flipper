apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// These exclusions are published in Maven metadata. Consumers must not need
// the development build's dependency-substitution rules to obtain 16 KB code.
configurations.configureEach {
    exclude group: 'com.facebook.yoga', module: 'yoga'
    exclude group: 'com.facebook.litho', module: 'litho-flexlayout'
}

android {
    namespace 'com.facebook.flipper.plugins.litho'
    compileSdkVersion rootProject.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion
    }

    compileOptions {
        targetCompatibility rootProject.javaTargetVersion
        sourceCompatibility rootProject.javaTargetVersion
    }

    dependencies {
        compileOnly deps.lithoAnnotations
        implementation project(':android')
        implementation deps.kotlinCoroutinesAndroid
        implementation deps.lithoCore
        implementation project(':native-yoga')
        implementation project(':native-flexlayout')
        api deps.lithoEditorCore
        api(deps.lithoEditorFlipper) {
            exclude group:'com.facebook.flipper', module:'flipper'
        }
        implementation deps.lithoSectionsDebug
        implementation deps.lithoSectionsWidget
        implementation deps.lithoSectionsCore
        implementation deps.lithoWidget
        implementation deps.supportAppCompat
        implementation deps.kotlinxSerializationJson
        compileOnly deps.jsr305

        testImplementation deps.junit
        testImplementation deps.robolectric
    }
}

apply plugin: 'com.vanniktech.maven.publish'
